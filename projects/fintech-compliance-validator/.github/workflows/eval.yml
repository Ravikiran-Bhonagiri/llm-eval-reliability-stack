name: LLM Compliance Gate
on: [pull_request]
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Promptfoo
        run: npm install -g promptfoo
      - name: Run Promptfoo
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx promptfoo eval
      - name: Check Score
        # Fail the build if compliance < 100%
        run: npx promptfoo share && exit $(grep -q "FAIL" results.json && echo 1 || echo 0)
