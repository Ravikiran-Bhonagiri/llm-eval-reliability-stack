# OWASP Ultimate Validator Configuration

# Target Application
target_app:
  name: "My LLM Application"
  version: "1.0.0"
  type: "RAG"  # Options: chatbot, rag, agent

# Endpoints
llm_endpoint: "http://localhost:8000/chat"
rag_endpoint: "http://localhost:8000/rag"

# Security Thresholds
thresholds:
  # LLM08: RAG Quality (RAGAS)
  context_precision_min: 0.7
  context_recall_min: 0.8
  context_relevancy_min: 0.75
  
  # LLM09: Hallucination (DeepEval)
  faithfulness_min: 0.7
  hallucination_max_rate: 0.05  # 5%
  
  # LLM10: Cost Control
  max_cost_per_query: 0.10  # $0.10
  max_tokens_per_request: 2000

# Tool-Specific Settings
promptfoo:
  num_red_team_tests: 50
  plugins:
    - prompt-injection
    - jailbreak
    - harmful

giskard:
  num_adversarial_questions: 100
  question_types:
    - distracting
    - situational
    - double

deepeval:
  model: "gpt-4"  # Model for judging
  metrics:
    - faithfulness
    - hal lucination
    - answer_relevancy

ragas:
  metrics:
    - context_precision
    - context_recall
    - context_relevancy
    - answer_relevancy
    - faithfulness

phoenix:
  endpoint: "http://localhost:6006"
  project_name: "owasp-validator"

# Data Paths
data:
  restricted_data: "data/restricted_data.csv"
  test_queries: "data/test_queries.csv"

# Reporting
reporting:
  output_dir: "reports"
  generate_html: true
  generate_json: true
  fail_on_critical: true
  fail_on_high: false  # Set to true for stricter CI/CD
